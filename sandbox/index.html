    :root,
    :host {

    body {

      width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .list {
      display: flex;
      flex-direction: row;

      display: flex;

<body class="dark">
  <main>
    <button id="toggle-mode">Toggle Mode</button>

    <!-- Required -->
    <form id="form" class="qwk-form">

      <label for="name">
        Name
        <input class="my-input" data-qwk-input-label="Name" type="text" id="name" value="Dallas" name="name"
          placeholder="" />
      </label>
      <label for="occupation">
        Occupation
        <input class="my-input" data-qwk-input-label="Occupation" type="text" id="occupation"
          value="Web developer" name="occupation" placeholder="" />
      </label>
      <label for="occupation">
        Biography
        <textarea class="my-input" data-qwk-input-label="Bio" type="text" id="bio" value="" name="bio"
          placeholder="">Sample paragraph</textarea>
      </label>
      <label for="work">
        Work Type
        <select class="my-input" data-qwk-input-label="Work" type="text" id="freelance" value="Freelance"
          name="work" placeholder="">
          <optgroup>
            <option selected>Freelance</option>
            <option>Contract</option>
            <option>Hired</option>
          </optgroup>
        </select>
      </label>
      <label for="relationship">
        Relationship
        <input class="my-input" data-qwk-input-label="Relationship" type="text" id="relationship" value="Married"
          name="relationship" placeholder="" />
      </label>
      <label for="importance">
        Importance
        <input class="my-input" data-qwk-input-label="Importance" type="number" value="4" id="importance"
          name="importance" min="0" max="10" placeholder="Task importance" />
      </label>
      <label for="importance">
        Due date
        <input class="my-input" data-qwk-input-label="Due date" type="date" value="2018-07-22" id="date" name="dueDate"
          min="0" max="10" placeholder="Task importance" />
      </label>
      <div>
        <button type="submit">Add A Task</button>
      </div>
    </form>


    <!-- Required element  -->
    <div id="container" class="qwk-container">
      <!-- Contains the list of items  -->
    </div>

  </main>

  <!-- JS -->
  <script type="module" src="./index.js"></script>
</body>
